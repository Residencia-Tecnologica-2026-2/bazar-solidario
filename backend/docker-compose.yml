services:
  db:
    image: postgres:16
    container_name: bazar-db
    environment:
      POSTGRES_DB: bazar_solidario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - bazar-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bazar_solidario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: bazar-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - bazar-uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bazar_solidario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_UPLOADS_DIRECTORY: /app/uploads
      JWT_SECRET: bazar-solidario-chave-docker-troque-esta-chave-123456

volumes:
  bazar-dados:
  bazar-uploads:
