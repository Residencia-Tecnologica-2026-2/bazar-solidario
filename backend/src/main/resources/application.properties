spring.application.name=bazar-solidario

spring.datasource.url=jdbc:postgresql://localhost:5432/bazar_solidario
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: em produção defina a variável de ambiente JWT_SECRET (mín. 32 caracteres)
jwt.secret=${JWT_SECRET:bazar-solidario-chave-de-desenvolvimento-troque-em-producao-123456}
# 24 horas
jwt.expiration-ms=86400000
