spring.application.name=bazar-solidario
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.directory=${APP_UPLOADS_DIRECTORY:uploads}
app.uploads.storage=${APP_UPLOADS_STORAGE:file}
app.asaas.api-key=${ASAAS_API_KEY:}
app.asaas.base-url=https://api-sandbox.asaas.com/v3
app.asaas.seller-id=${ASAAS_SELLER_ID:0}
app.asaas.isac-wallet-id=${ASAAS_ISAC_WALLET_ID:}
app.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
server.port=${PORT:8080}
server.error.include-message=never
